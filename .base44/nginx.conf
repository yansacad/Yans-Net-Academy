# Main nginx config for the Base44 preview (mounted at /etc/nginx/nginx.conf).
#
# The sandbox checkout is mode 0700 owned by root, so a worker running as the
# unprivileged `nginx` user cannot read the bind-mounted source. The workers
# therefore run as root inside this throwaway, read-only dev container; the
# mount stays `:ro`, so nothing can write into the repository through it.
# Repository metadata (dotfiles, this compose file) is denied below.

user root;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # The repository root is served so edits appear without a rebuild, but
        # repository/sandbox metadata must not be readable through the preview.
        location ~ /\. {
            deny all;
        }
        location = /docker-compose.base44.yml {
            deny all;
        }
        location = /AGENTS.md {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
